<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kewlbeerd Live Rooms</title><link rel="stylesheet" href="styles.css"></head><body><main class="shell"><header><a class="brand" href="/">Kewlbeerd Live</a><span id="connection" class="pill">Not configured</span></header><section class="hero"><p class="eyebrow">LIVE ROOM FOUNDATION</p><h1>Create a room.<br><em>Bring people in.</em></h1><p>This first slice supports room creation, room lookup, and the foundation for live audience presence.</p></section><section class="grid"><form id="create-room" class="card"><p class="eyebrow">HOST A ROOM</p><h2>Start a live room</h2><label>Room title<input id="title" required maxlength="100" placeholder="Tonight's creator session"></label><label>Room link<input id="slug" required pattern="[a-z0-9-]+" placeholder="creator-session"></label><button type="submit">Create room</button><p id="create-status" class="hint"></p></form><form id="join-room" class="card card-dark"><p class="eyebrow">JOIN A ROOM</p><h2>Enter a live room</h2><label>Room link<input id="join-slug" required pattern="[a-z0-9-]+" placeholder="creator-session"></label><button type="submit">Find room</button><p id="join-status" class="hint"></p></form></section><section id="room" class="room hidden"><div><p class="eyebrow">ROOM STATUS</p><h2 id="room-title"></h2><p id="room-meta"></p></div><span id="room-status" class="pill">Scheduled</span></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script></body></html>
